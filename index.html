<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Detron — Light cycles, in reverse</title>
<meta name="description" content="Light cycles, in reverse. The arena starts solid and your cycle carves a tunnel wherever it goes. Hit any tunnel or the edge and you're out. Last one moving wins.">
<meta name="theme-color" content="#0a0e14">
<style>
  /* Palette, tiles and buttons copied from Snaked (itself copied from Breakin) so the collection reads as one family. */
  [hidden]{display:none!important;}
  html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;
    padding-top:calc(76px + env(safe-area-inset-top,0px));}
  canvas{background:#0d1420;display:block;touch-action:none;
    box-shadow:0 0 80px rgba(80,140,255,.18);border-radius:4px;}
  #hud{position:fixed;top:calc(9px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;z-index:30;
    justify-content:center;gap:7px;padding:0 8px;pointer-events:none;font-variant-numeric:tabular-nums;}
  #hud .stat{display:flex;flex-direction:column;align-items:center;min-width:50px;
    background:rgba(9,13,20,.55);border-radius:13px;padding:6px 10px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  #hud .stat b{font-size:27px;font-weight:800;line-height:1;text-shadow:0 0 16px currentColor;}
  #hud .stat i{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7f8ca0;font-style:normal;margin-top:4px;}
  #hud .st-time b{color:#57d3ff;min-width:52px;text-align:center;}
  #hud .st-riv b{color:#b98bff;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;color:#e8edf4;text-align:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
    background:radial-gradient(ellipse 78% 56% at 50% 40%,
      rgba(9,12,18,.8) 0%, rgba(9,12,18,.62) 46%, rgba(9,12,18,.12) 100%);
    -webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);}
  #overlay .badge{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#5f86b8;margin-bottom:6px;}
  #overlay h1{font-size:clamp(36px,12vw,50px);margin:0 0 8px;font-weight:800;letter-spacing:.14em;
    color:#eaf2ff;text-shadow:0 0 32px rgba(95,176,255,.5),0 2px 0 rgba(0,0,0,.35);}
  #overlay p{margin:4px 0;color:#9fadc1;font-size:14px;max-width:300px;line-height:1.5;
    text-shadow:0 1px 6px rgba(6,9,14,.9);}
  #overlay b{color:#e8edf4;}
  #overlay>:first-child{margin-top:auto;} #overlay>:last-child{margin-bottom:auto;}
  #stats{margin:8px 0 2px;color:#9fadc1;font-size:14px;}
  #stats b{color:#ffd25f;font-size:20px;}
  #startBtn{margin:16px 0 0;padding:12px 54px;color:#05121f;border:0;border-radius:999px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;
    background:linear-gradient(180deg,#84c4ff,#48a2f3);
    box-shadow:0 10px 34px rgba(72,162,243,.42);animation:breathe 2.4s ease-in-out infinite;}
  #startBtn .lbl{font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.1;}
  #startBtn .sub{font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.6;}
  #startBtn:active{transform:scale(.96);}
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 10px 34px rgba(72,162,243,.34);}
    50%{transform:scale(1.045);box-shadow:0 14px 46px rgba(72,162,243,.62);}}
  @media (prefers-reduced-motion:reduce){#startBtn{animation:none;}}
  .how{font-size:12px!important;color:#6b7a90!important;margin-top:10px!important;}
  #pad{position:fixed;left:0;right:0;margin:0 auto;max-width:480px;box-sizing:border-box;padding:0 12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,44px);gap:4px;touch-action:none;}
  #pad .hub{grid-column:2;grid-row:2;background:rgba(120,160,220,.03);border-radius:14px;}
  #pad.idle{visibility:hidden;}
  #pad button{display:flex;align-items:center;justify-content:center;padding:0;pointer-events:auto;
    color:rgba(230,240,255,.62);background:rgba(120,160,220,.13);border:1px solid rgba(120,160,220,.26);border-radius:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  #pad button svg{width:40px;height:40px;fill:currentColor;}
  #pad button.on{background:rgba(120,160,220,.3);border-color:rgba(132,196,255,.6);color:rgba(240,246,255,.95);}
  #pad .u{grid-column:2;grid-row:1;} #pad .l{grid-column:1;grid-row:2;}
  #pad .d{grid-column:2;grid-row:3;} #pad .r{grid-column:3;grid-row:2;}
  #sab{position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;}
  #pause{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:rgba(6,9,14,.72);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);color:#8ba0bd;text-align:center;}
  #pause .ptitle{font-size:15px;letter-spacing:.3em;text-transform:uppercase;}
  #pause .phint{font-size:12px;color:#67788f;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud" hidden>
  <div class="stat st-time"><b id="hTime">0.0</b><i>time</i></div>
  <div class="stat st-riv"><b id="hRiv">3</b><i>rivals</i></div>
</div>
<div id="pad" class="idle">
  <button class="u" data-d="U" aria-label="up"><svg viewBox="0 0 24 24"><path d="M12 5l8 10H4z"/></svg></button>
  <button class="l" data-d="L" aria-label="left"><svg viewBox="0 0 24 24"><path d="M5 12l10-8v16z"/></svg></button>
  <div class="hub" aria-hidden="true"></div>
  <button class="d" data-d="D" aria-label="down"><svg viewBox="0 0 24 24"><path d="M12 19L4 9h16z"/></svg></button>
  <button class="r" data-d="R" aria-label="right"><svg viewBox="0 0 24 24"><path d="M19 12L9 20V4z"/></svg></button>
</div>
<div id="sab"></div>
<div id="pause" hidden><div class="ptitle">Paused</div><div class="phint" id="pHint">tap anywhere to carry on</div></div>
<div id="overlay">
  <div class="badge" id="badge">Light cycles, in reverse</div>
  <h1 id="title">DETRON</h1>
  <p id="msg">The arena starts solid. <b>Your cycle carves a tunnel wherever it goes.</b> Hit any tunnel &mdash; yours or a rival&rsquo;s &mdash; or the edge, and you&rsquo;re out. Last one moving wins.</p>
  <div id="stats" hidden></div>
  <button id="startBtn"><span class="lbl" id="startLbl">Play</span><span class="sub" id="startSub">click to start</span></button>
  <p class="how" id="how"></p>
</div>
<script>
// ---- rules -----------------------------------------------------------------------------
// ponytail: prototype - no sound, leaderboard, pause menu or offline copy yet; add them once the core rule is kept.
const COLS = 18, ROWS = 28, CELL = 20, W = COLS * CELL, H = ROWS * CELL;
const DIRS = {U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0]}, BACK = {U: 'D', D: 'U', L: 'R', R: 'L'};
const COLORS = [[87, 211, 255], [185, 139, 255], [255, 122, 192], [255, 157, 92]];   // you (cyan), then the three bots
const START = [[9, 24, 'U'], [8, 3, 'D'], [2, 14, 'R'], [15, 13, 'L']];              // bottom, top, left, right
const MS_START = 125, MS_END = 80, RAMP_S = 60;                                       // speeds up over the first minute
const COUNT_S = 3;
const isTouch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0 || /[?&]touch/.test(location.search);

let grid, cycles, mode = 'attract', elapsed = 0, acc = 0, queue = [], countT = 0, endT = 0, parts = [], place = 0;
const cx = i => i % COLS, cy = i => (i / COLS) | 0;
function step1(i, d) {
  const x = cx(i) + DIRS[d][0], y = cy(i) + DIRS[d][1];
  return x < 0 || y < 0 || x >= COLS || y >= ROWS ? -1 : y * COLS + x;
}
const interval = () => MS_START - (MS_START - MS_END) * Math.min(1, elapsed / RAMP_S);

function newRound(withPlayer) {
  grid = new Uint8Array(COLS * ROWS);   // 0 = solid rock, n = tunnel carved by cycle n
  cycles = START.map(([x, y, d], k) => {
    const i = y * COLS + x;
    grid[i] = k + 1;
    return {id: k + 1, i, prev: i, dir: d, alive: true, bot: k > 0 || !withPlayer, path: [i], col: COLORS[k], skill: 0.75 + Math.random() * 0.25};
  });
  elapsed = 0; acc = 0; queue = []; parts = []; place = 0;
}

// ---- bots ------------------------------------------------------------------------------
// Each move: try every turn that doesn't crash straight away, score it by how much rock it can still reach
// (a capped flood fill), keep going straight on ties, and now and then pick a worse move so bots aren't perfect.
function reach(from, cap) {
  const seen = new Uint8Array(COLS * ROWS), q = [from]; seen[from] = 1;
  for (let qi = 0; qi < q.length && q.length < cap; qi++)
    for (const d in DIRS) { const j = step1(q[qi], d); if (j >= 0 && !seen[j] && !grid[j]) { seen[j] = 1; q.push(j); } }
  return q.length;
}
function botDir(c) {
  let best = c.dir, bestScore = -1;
  for (const d in DIRS) {
    if (d === BACK[c.dir]) continue;
    const j = step1(c.i, d);
    if (j < 0 || grid[j]) continue;
    let s = reach(j, 220) + (d === c.dir ? 3 : 0) + Math.random() * 6;
    for (const o of cycles) if (o !== c && o.alive && Math.abs(cx(o.i) - cx(j)) + Math.abs(cy(o.i) - cy(j)) === 1) s -= 40;   // don't meet a head
    if (Math.random() > c.skill) s = Math.random() * 50;                                                             // a slip
    if (s > bestScore) { bestScore = s; best = d; }
  }
  return best;
}

// ---- one move for everyone at once ------------------------------------------------------
function tick() {
  const live = cycles.filter(c => c.alive);
  for (const c of live) {
    if (c.bot) c.dir = botDir(c);
    else while (queue.length) { const d = queue.shift(); if (d !== BACK[c.dir] && d !== c.dir) { c.dir = d; break; } }
    c.next = step1(c.i, c.dir);
  }
  const hits = {};
  for (const c of live) if (c.next >= 0) hits[c.next] = (hits[c.next] || 0) + 1;
  const dead = live.filter(c => c.next < 0 || grid[c.next] || hits[c.next] > 1);
  for (const c of live) {
    c.prev = c.i;
    if (dead.includes(c)) continue;
    c.i = c.next; grid[c.i] = c.id; c.path.push(c.i);
  }
  for (const c of dead) crash(c, live.length - dead.length + 1);
}
function crash(c, finish) {
  c.alive = false; c.prev = c.i;
  if (!c.bot) place = finish;
  const x = (cx(c.i) + 0.5) * CELL, y = (cy(c.i) + 0.5) * CELL;
  for (let k = 0; k < 26; k++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 140;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.5, col: rgb(c.col)});
  }
}

// ---- game flow ----------------------------------------------------------------------------
function step(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (mode === 'play' || mode === 'attract') {
    elapsed += dt; acc += dt * 1000;
    for (let g = 0; g < 8 && acc >= interval(); g++) { acc -= interval(); tick(); if (checkEnd()) break; }
    if (mode === 'play') { $('hTime').textContent = elapsed.toFixed(1); $('hRiv').textContent = cycles.filter(c => c.bot && c.alive).length; }
  } else if (mode === 'count') {
    countT -= dt; if (countT <= 0) mode = 'play';
  } else if (mode === 'over' || mode === 'attractOver') {
    endT -= dt;
    if (endT <= 0) { if (mode === 'attractOver') { newRound(false); mode = 'attract'; } else { mode = 'result'; showResult(); } }
  }
}
function checkEnd() {
  const live = cycles.filter(c => c.alive), me = cycles[0];
  if (mode === 'play' && (!me.alive || live.length === 0 || (live.length === 1 && live[0] === me))) {
    if (me.alive) place = 1;
    mode = 'over'; endT = 1.1; pad.classList.add('idle'); return true;
  }
  if (mode === 'attract' && live.length <= 1) { mode = 'attractOver'; endT = 1.5; return true; }
  return false;
}
function startPlay() {
  newRound(true); mode = 'count'; countT = COUNT_S;
  $('overlay').hidden = true; $('hud').hidden = false; pad.classList.remove('idle');
  $('hTime').textContent = '0.0'; $('hRiv').textContent = 3;
}
function showResult() {
  const won = place === 1 && cycles[0].alive;
  const draw = place === 1 && !won;
  $('badge').textContent = won ? 'last one moving' : draw ? 'everyone crashed at once' : 'you crashed';
  $('title').textContent = won ? 'YOU WIN' : draw ? 'DRAW' : 'CRASHED';
  $('msg').textContent = won ? 'Every rival carved themselves into a corner.' : 'Rock is road. Tunnels are walls.';
  const s = $('stats'); s.hidden = false;
  s.innerHTML = 'Place <b>' + place + '</b> of 4 &middot; Time <b>' + elapsed.toFixed(1) + 's</b>';
  $('startLbl').textContent = 'Play again';
  $('hud').hidden = true; $('overlay').hidden = false;
}
function pause() { if (mode !== 'play' && mode !== 'count') return; mode = 'paused'; queue = []; $('pause').hidden = false; }
function resume() { $('pause').hidden = true; mode = 'count'; countT = COUNT_S; }

// ---- input ------------------------------------------------------------------------------
const $ = id => document.getElementById(id), pad = $('pad');
if (!isTouch) pad.hidden = true;
function turn(d) {
  if (mode !== 'play' && mode !== 'count') return;
  const last = queue.length ? queue[queue.length - 1] : cycles[0].dir;
  if (d === last || d === BACK[last] || queue.length >= 2) return;
  queue.push(d);
}
const KEYS = {ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R'};
addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); return; }
  if (e.key === 'Escape' || e.key === 'p') { mode === 'paused' ? resume() : pause(); return; }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (mode === 'paused') resume(); else if (mode === 'count') countT = Math.min(countT, 0.01);
    else if (!$('overlay').hidden) startPlay();
  }
});
for (const b of pad.querySelectorAll('button')) {
  b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.d); b.classList.add('on'); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => b.classList.remove('on'));
}
let swipe = null;
const canvas = $('cv');
canvas.addEventListener('pointerdown', e => {
  if (mode === 'count') { countT = Math.min(countT, 0.01); return; }
  const r = canvas.getBoundingClientRect();
  if (mode === 'play' && isTouch && e.clientY - r.top < r.height / 2) { pause(); return; }   // Snaked's rule: tap the top half to pause
  swipe = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('pointermove', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  swipe = {x: e.clientX, y: e.clientY};
});
addEventListener('pointerup', () => { swipe = null; });
$('pause').addEventListener('pointerdown', resume);
$('startBtn').addEventListener('click', startPlay);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
$('startSub').textContent = isTouch ? 'tap to start' : 'click to start';
$('how').textContent = isTouch ? 'steer with the arrow buttons, or swipe' : 'arrow keys or WASD steer · Esc pauses';
$('pHint').textContent = isTouch ? 'tap anywhere to carry on' : 'press Esc or click to carry on';

// ---- drawing ----------------------------------------------------------------------------
const ctx = canvas.getContext('2d');
let scale = 1, dpr = 1;
const PAD_H = 3 * 44 + 2 * 4;
function fit() {   // Snaked's: as big as the screen allows, stopping above the arrow pad on phones
  const top = parseFloat(getComputedStyle($('wrap')).paddingTop) || 76;
  const floor = innerHeight - 12 - $('sab').offsetHeight - (isTouch ? PAD_H + 6 : 0);
  const aw = Math.min(innerWidth - (isTouch ? 0 : 16), 480), ah = floor - top;
  scale = Math.max(0.3, Math.min(aw / W, ah / H));
  if (isTouch) pad.style.gridTemplateRows = 'repeat(3,' + (PAD_H - 8 + Math.max(0, ah - H * scale)) / 3 + 'px)';
  dpr = Math.min(2, devicePixelRatio || 1);
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
}
const mix = (a, b, f) => a.map((v, k) => Math.round(v + (b[k] - v) * f));
const rgb = c => 'rgb(' + c.join(',') + ')';
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = '#070a10'; ctx.fillRect(0, 0, W, H);   // carved tunnel floor: darker than anything else
  // rock: every uncarved cell is a solid tile with a faint top highlight
  for (let i = 0; i < grid.length; i++) {
    const x = cx(i) * CELL, y = cy(i) * CELL;
    if (!grid[i]) {
      ctx.fillStyle = '#1b2638'; ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x + 2, y + 1.5, CELL - 4, 2);
    } else {
      ctx.fillStyle = rgb(mix(cycles[grid[i] - 1].col, [7, 10, 16], 0.86)); ctx.fillRect(x, y, CELL, CELL);
    }
  }
  const t = Math.min(1, acc / interval());
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const c of cycles) {
    const live = c.alive && (mode === 'play' || mode === 'attract');
    const pts = c.path.map(i => [(cx(i) + 0.5) * CELL, (cy(i) + 0.5) * CELL]);
    if (live && pts.length > 1) {   // the head glides into its newest cell
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      pts[pts.length - 1] = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    const col = c.alive ? c.col : mix(c.col, [13, 20, 32], 0.55);
    ctx.save();
    ctx.strokeStyle = rgb(col); ctx.lineWidth = 4; ctx.shadowColor = rgb(col); ctx.shadowBlur = c.alive ? 10 : 0;
    ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    const [hx, hy] = pts[pts.length - 1];
    if (c.alive) { ctx.shadowBlur = 18; ctx.fillStyle = rgb(c.col); ctx.beginPath(); ctx.roundRect(hx - 7, hy - 7, 14, 14, 4); ctx.fill(); }
    ctx.restore();
    if (!c.bot && c.alive) { ctx.fillStyle = '#05121f'; ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, Math.PI * 2); ctx.fill(); }   // a dot marks you
  }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.5)); ctx.fillStyle = p.col; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  if (mode === 'count') {
    ctx.fillStyle = 'rgba(9,12,18,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 86px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.shadowColor = 'rgba(95,176,255,.6)'; ctx.shadowBlur = 32; ctx.fillStyle = '#eaf2ff';
    ctx.fillText(Math.max(1, Math.ceil(countT)), W / 2, H / 2);
    ctx.shadowBlur = 0; ctx.fillStyle = '#9fadc1'; ctx.font = '600 13px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('you are the cyan one with the dot', W / 2, H / 2 + 70);
    ctx.restore();
  }
}

let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  step(dt); draw(); requestAnimationFrame(frame);
}
addEventListener('resize', fit);
fit(); newRound(false); draw(); requestAnimationFrame(frame);
</script>
</body>
</html>
